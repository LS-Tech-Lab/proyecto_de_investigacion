<style>
:root{
  --bg:#F4F6FA;--sf:#FFFFFF;--ink:#0F1B2D;--mu:#4A5568;--ln:#DDE3EC;--ac:#1E4E8C;
  --c1:#1E4E8C;--c2:#0E8A7D;--c3:#D4553F;--c4:#B87A0C;--c5:#6A56C9;--c6:#51657A;--bad:#B3322B;

  --sh-3:0 6px 12px rgba(15,43,76,.08),0 20px 40px rgba(15,43,76,.12);
  --sh:var(--sh-2);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1220;--sf:#151D2E;--ink:#EDF1F7;--mu:#9DA9BC;--ln:#26314A;--ac:#6FA3EF;
  --c1:#6FA3EF;--c2:#4CC2B2;--c3:#F2806B;--c4:#E5B24A;--c5:#A394F0;--c6:#9FB2C8;--bad:#F08A84;
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.3);
  --sh-2:0 2px 4px rgba(0,0,0,.3),0 10px 20px rgba(0,0,0,.4);
  --sh-3:0 6px 12px rgba(0,0,0,.4),0 20px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220;--sf:#151D2E;--ink:#EDF1F7;--mu:#9DA9BC;--ln:#26314A;--ac:#6FA3EF;
  --c1:#6FA3EF;--c2:#4CC2B2;--c3:#F2806B;--c4:#E5B24A;--c5:#A394F0;--c6:#9FB2C8;--bad:#F08A84;
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.3);
  --sh-2:0 2px 4px rgba(0,0,0,.3),0 10px 20px rgba(0,0,0,.4);
  --sh-3:0 6px 12px rgba(0,0,0,.4),0 20px 40px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:20px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:6px}
.top{height:48px;flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;font:600 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.top .sp{flex:1}.top b{color:var(--ink)}
.top #sec{display:inline-flex;align-items:center;gap:7px;transition:color .35s}
.top #sec::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.9;flex:none}
.tb{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 13px;font:600 12px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.pgs{display:flex;gap:3px;padding:0 24px;height:5px;flex:none}
.pgs button{flex:1;border:0;border-radius:3px;background:var(--ln);padding:0;transition:background .3s,transform .2s,box-shadow .2s}

.pgs .d{background:var(--mu)}
.pgs .c{
  background:linear-gradient(90deg,var(--c1),var(--c2));

             0 2px 10px color-mix(in srgb,var(--c2) 30%,transparent)}

#st{position:absolute;left:0;top:0;width:1280px;height:640px;transform-origin:0 0}

.s.on{display:grid;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dpIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.s.on .g > *,.s.on .obj > *,.s.on .stack > *{

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mn{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px;position:relative}
.wm{

.g{display:grid;gap:12px}
.pg2{grid-template-columns:repeat(2,1fr)}.pg3{grid-template-columns:repeat(3,1fr)}.pg4{grid-template-columns:repeat(4,1fr)}.pg5{grid-template-columns:repeat(5,1fr)}.pg6{grid-template-columns:repeat(6,1fr)}
.pk{
  display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;
  border-radius:14px;border:1px solid var(--ln);border-top:4px solid var(--k);

.pk .n{font:700 13px Inter,sans-serif;letter-spacing:.06em;color:var(--k)}

.pk[aria-pressed=true]{

.pg6 .pk b{font-size:16px}.pg6 .pk{padding:11px 10px}
.pg5.tl .pk:not(:last-child)::after{content:"›";position:absolute;right:-12px;top:50%;font:700 24px sans-serif;color:var(--mu)}
.pg5.tl .pk{position:relative}
.bar{display:block;height:8px;border-radius:4px;background:var(--ln);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--k);transition:width .5s ease}
.dp{
  flex:1;min-height:0;overflow:hidden;background:var(--sf);
  border:1px solid var(--ln);border-left:6px solid var(--k,var(--ac));
  border-radius:14px;padding:18px 26px;font-size:21px;line-height:1.4;
  box-shadow:var(--sh-3)}
.dp h3,.dp p{animation:dpIn .28s ease both}
.dp p:nth-of-type(2){animation-delay:.05s}
.dp p:nth-of-type(3){animation-delay:.1s}
.dp h3{font:800 30px/1.1 'Plus Jakarta Sans',sans-serif;margin:0 0 10px;color:var(--k)}
.dp p{margin:0 0 11px}.dp .lb{display:block;font:600 12.5px Inter,sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin-bottom:1px}
.dp .cite{font-size:17px;color:var(--mu)}
.row{display:flex;gap:20px;flex:1;min-height:0}.vz{flex:none;width:420px}.vz svg{width:100%;height:100%}
svg text{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700}
.nd{cursor:pointer;outline:none}.nd:focus-visible .bx{stroke-width:4}
.nd .bx{fill:color-mix(in srgb,var(--k) 12%,var(--sf));stroke:var(--k);stroke-width:2.5;transition:fill .18s,stroke .18s,stroke-width .15s}
.nd text{fill:var(--k)}
.nd[aria-pressed=true] .bx{fill:var(--k);stroke-width:3}.nd[aria-pressed=true] text{fill:var(--bg)}
.nd:hover .bx{stroke-width:4}
.hero{
  flex:1;border-radius:22px;padding:34px 44px;color:#fff;
  background:linear-gradient(135deg,#0F2B4C 0%,#1E4E8C 58%,#0E8A7D 100%);
  position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  box-shadow:var(--sh-3)}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 600px 380px at 82% 18%,rgba(14,138,125,.35),transparent 70%),
    radial-gradient(ellipse 480px 460px at 12% 88%,rgba(30,78,140,.45),transparent 70%)}
.hero svg{position:absolute;right:-10px;top:0;height:100%;opacity:.5}
.hero>*:not(svg){position:relative}
.hero .eb{font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.1em;opacity:.85;margin:0}
.hero h1{font:800 52px/1.05 'Plus Jakarta Sans',sans-serif;letter-spacing:-.025em;margin:16px 0 18px;max-width:640px}
.hero .meta{font-size:20px;line-height:1.5;opacity:.95;margin:0}
.hero .pill{display:inline-block;margin-top:20px;padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.16);font:600 14px Inter,sans-serif;width:max-content}
.start{
  display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:11px 22px;
  border:0;border-radius:99px;background:#fff;color:#0F2B4C;
  font:700 15px 'Plus Jakarta Sans',sans-serif;
  box-shadow:var(--sh-3);
  width:max-content;transition:transform .15s,box-shadow .15s}
.start:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.3)}
.start svg{width:18px;height:18px;fill:currentColor}
.q1{font:800 40px/1.12 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;margin:2px 0 4px}
.q1 span{color:var(--c2)}
.obj{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ob{background:var(--sf);border:1px solid var(--ln);border-top:4px solid var(--k);border-radius:14px;padding:12px 14px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:6px;font-size:18px;line-height:1.3;transition:box-shadow .2s,transform .15s}
.ob:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.ob .nn{font:800 26px 'Plus Jakarta Sans',sans-serif;color:var(--k);line-height:1}
.ob .pl{display:flex;flex-wrap:wrap;gap:5px}.ob .pl span{font-size:14px;background:color-mix(in srgb,var(--k) 12%,var(--sf));color:var(--k);padding:2px 9px;border-radius:99px;font-weight:600}
.ob button{margin-top:auto;border:1px solid var(--k);color:var(--k);background:transparent;border-radius:99px;padding:4px 10px;font:600 13px Inter,sans-serif;align-self:flex-start;transition:background .15s,color .15s}
.ob button:hover{background:var(--k);color:var(--sf)}
.pur{border-radius:14px;padding:14px 20px;background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;font-size:20px;line-height:1.35;box-shadow:var(--sh-2)}
.pur b{display:block;font:600 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.1em;opacity:.85;margin-bottom:2px}
.card{border:1px solid var(--ln);border-top:4px solid var(--k);border-radius:14px;background:var(--sf);padding:12px 18px;box-shadow:var(--sh-1);transition:box-shadow .2s}
.card:hover{box-shadow:var(--sh-2)}
.card b{display:block;font:800 20px 'Plus Jakarta Sans',sans-serif;color:var(--k);margin-bottom:2px}.card p{margin:3px 0;font-size:18px;line-height:1.35}
.ref p{margin:0 0 16px;padding-left:30px;text-indent:-30px;font-size:20px;line-height:1.45}
.stack{display:flex;flex-direction:column;gap:8px;justify-content:center}
.band{border-radius:12px;border:2px solid var(--k);background:color-mix(in srgb,var(--k) 10%,var(--sf));padding:10px 16px;font:700 18px 'Plus Jakarta Sans',sans-serif;color:var(--k);text-align:left;position:relative;overflow:hidden;transition:background .2s,color .2s,box-shadow .2s}
.band:hover{box-shadow:var(--sh-2)}
.band small{display:block;font:500 14px Inter,sans-serif;color:var(--mu)}
.band::after{content:"";position:absolute;right:16px;top:12px;bottom:12px;width:70px;background:repeating-linear-gradient(var(--k) 0 3px,transparent 3px 11px);opacity:.28;border-radius:2px}
.band[aria-pressed=true]{background:var(--k);color:var(--bg);box-shadow:0 0 0 1.5px var(--k),var(--sh-2)}.band[aria-pressed=true] small{color:var(--bg);opacity:.9}.band[aria-pressed=true]::after{background:repeating-linear-gradient(var(--bg) 0 3px,transparent 3px 11px)}
.md{display:flex;flex-direction:column;gap:8px;padding-top:6px;min-height:0}
.mb{width:100%;border-radius:14px;background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac);box-shadow:var(--sh-1);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mb-head{display:flex;align-items:center;gap:8px;font:600 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.mb-head svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mb audio{width:100%;accent-color:var(--ac)}
.mb .em{color:var(--mu);font-size:14px;line-height:1.4;padding:4px 0}
.mb .em code{font:600 13px ui-monospace,monospace;background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--ink)}
.ms{margin:0;font-size:14px;color:var(--mu);min-height:20px}
.ft{height:46px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;font:600 13px Inter,sans-serif;color:var(--mu)}
.ft button{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 16px;font-size:15px;color:var(--ink);transition:background .15s,border-color .15s,color .15s}
.ft button:hover{border-color:var(--ac)}
.ft .tx{font:600 12px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.ft #au{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.ft #au.on{background:var(--c2);border-color:var(--c2);color:#fff}
#clk,#ct{font-variant-numeric:tabular-nums}
#ix{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 96%,transparent);z-index:9;display:none;padding:70px 20px 20px;overflow:auto}
#ix.on{display:block}#ix div{max-width:760px;margin:0 auto;display:grid;gap:6px}
#ix button{text-align:left;padding:10px 16px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);transition:background .15s,border-color .15s}
#ix button:hover{border-color:var(--ac)}
body.mob{overflow:auto;height:auto;min-height:100%}
body.mob .top{position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap;height:auto;padding:8px 16px}
body.mob .pgs{padding:0 16px}body.mob main{flex:none}
body.mob #st{position:static;width:auto;height:auto;transform:none!important}
body.mob .s{position:static;grid-template-columns:1fr;padding:20px 16px;overflow:visible;row-gap:16px}
body.mob .md{padding-top:0}body.mob .mb{width:100%}
body.mob .pg3,body.mob .pg4,body.mob .pg5,body.mob .pg6,body.mob .obj{grid-template-columns:repeat(2,1fr)}
body.mob .row{flex-direction:column}body.mob .vz{width:100%;height:auto}body.mob .dp{flex:none;overflow:visible}
body.mob h2{font-size:26px}body.mob .hero h1{font-size:32px}body.mob .q1{font-size:28px}body.mob .wm{font-size:64px;right:12px}
body.mob .ft{position:sticky;bottom:0;background:var(--bg);flex-wrap:wrap;height:auto;padding:6px}
</style>
</head>
<body>
<header class="top"><span><b>Proyecto I · Unidad I</b></span><span id="sec">Inicio</span><span class="sp"></span><span id="clk" title="Tiempo de exposición">00:00</span><button class="tb" id="ixb" aria-label="Abrir índice">Índice</button><button class="tb" id="th" aria-label="Cambiar tema">Modo oscuro</button></header>
<nav class="pgs" id="pgs" aria-label="Progreso"></nav>
<main id="mn"><div id="st"></div></main>
<footer class="ft"><button id="pv" aria-label="Diapositiva anterior">←</button><span id="ct">1 / 15</span><button id="nx" aria-label="Diapositiva siguiente">→</button><button id="au" class="tx" aria-label="Reproducción automática">Reproducción automática</button><button id="mu" class="tx" aria-label="Música ambiental">Música: no</button></footer>
<div id="ix" role="dialog" aria-label="Índice"><div id="il"></div></div>
<script>
const $=(s)=>document.querySelector(s);
const q=(h,b)=>`<p><span class="lb">${h}</span>${b}</p>`;
const PK={};
const IC={sis:'<path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 10.5M3.5 18l1.5 1.5L7.5 16"/>',obj:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/>',ver:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11l2 2 4-4"/>',rep:'<path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/>',cri:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-.9.6-1.5 1.1-1.5 2M12 17h.01"/>',acu:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',bar:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',cmp:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',pie:'<path d="M21 12A9 9 0 1112 3v9h9z"/>',doc:'<path d="M7 3h7l4 4v14H7zM14 3v4h4M10 12h5M10 16h5"/>',docs:'<path d="M8 3h7l4 4v11H8zM15 3v4h4M5 7v14h11"/>'};
const ico=(k)=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const chip=(id,j,x,n)=>`<button class="pk" data-pk="${id}" data-j="${j}" aria-pressed="${j===0}" style="--k:var(--c${x.c})">${x.i?ico(x.i):`<span class="n">${x.n||String(j+1).padStart(2,'0')}</span>`}<b>${x.h}</b>${x.s?`<small>${x.s}</small>`:''}${x.bar?`<span class="bar"><i style="width:${x.bar}%"></i></span>`:''}</button>`;
const pick=(id,cols,items,hint,cls)=>{PK[id]=items;return `<div><p class="tag">${hint||'Seleccione un elemento'}</p><div class="g pg${cols} ${cls||''}">${items.map((x,j)=>chip(id,j,x)).join('')}</div></div><div class="dp" id="dp-${id}" aria-live="polite"></div>`};
const viz=(id,items,v,hint)=>{PK[id]=items;return `<p class="tag">${hint}</p><div class="row"><div class="vz">${v}</div><div class="dp" id="dp-${id}" aria-live="polite"></div></div>`};
const showPk=(id,j)=>{const arr=PK[id];if(!arr||!arr[j])return;const x=arr[j],d=$('#dp-'+id);if(!d)return;d.style.setProperty('--k',`var(--c${x.c})`);d.innerHTML=`<h3>${x.h}</h3>${x.d}`};
const T=(t)=>`<h2>${t}</h2>`;
const src=(t)=>`<p class="src">Fuentes: ${t}</p>`;
const nd=(id,j,k,body,label)=>`<g class="nd" data-pk="${id}" data-j="${j}" tabindex="0" role="button" aria-label="${label}" aria-pressed="${j===0}" style="--k:var(--c${k})">${body}</g>`;

/* ring del método científico */
const ringItems=[
 {c:1,h:'Observación',d:q('Descripción','identificación sistemática de un fenómeno de interés.')+q('Ejemplo','la producción científica de una dependencia disminuye en dos períodos consecutivos.')},

    if(isFinite(audio.duration)){
      const m=Math.floor(audio.duration/60),s=Math.floor(audio.duration%60);
      ms(i,`Duración: ${m}:${String(s).padStart(2,'0')}`);
    }
  });
}
S.forEach((_,i)=>paintMedia(i));

/* ============ Navegación ============ */
const SEC_COLOR={'Inicio':'--c1','Introducción':'--c2','Fundamentos':'--c5','Clasificación':'--c4','Proyecto':'--c3','Cierre':'--c1'};
let AUTO=false,tmr=0;
function go(i){
  cur=Math.max(0,Math.min(S.length-1,i));
  S.forEach((_,k)=>{
    $('#s'+k).classList.toggle('on',k===cur);
    const b=$('#pgs').children[k];
    b.className=k<cur?'d':(k===cur?'c':'');
  });
  $('#sec').textContent=S[cur].sec;
  $('#sec').style.color=`var(${SEC_COLOR[S[cur].sec]||'--mu'})`;
  $('#ct').textContent=(cur+1)+' / '+S.length;
  $('#ix').classList.remove('on');
  window.scrollTo(0,0);
  playCur();
}
/* Cronómetro de exposición: arranca al iniciar la presentación, se pausa al detenerla o al terminar */
let clkRun=false,clkBase=0,clkAt=0;
function clkShow(){
  const s=Math.floor((clkBase+(clkRun?Date.now()-clkAt:0))/1000);
  $('#clk').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function clkStart(){if(!clkRun){clkRun=true;clkAt=Date.now()}clkShow()}
function clkPause(){if(clkRun){clkBase+=Date.now()-clkAt;clkRun=false}clkShow()}
function clkReset(){clkBase=0;clkRun=false;clkShow()}

/* Un único reproductor de locución para la presentación automática.
   iOS/Safari solo permiten reproducir sin gesto un elemento que ya fue activado
   por un toque; por eso se reutiliza el mismo elemento y solo se cambia su src. */
const NARR=new Audio();
NARR.preload='auto';
NARR.playsInline=true;
function playCur(){
  clearTimeout(tmr);
  document.querySelectorAll('.mb audio').forEach(e=>e.pause());
  NARR.onended=null;NARR.onerror=null;NARR.onloadedmetadata=null;
  NARR.pause();
  if(!AUTO)return;
  const i=cur;
  const pad=String(i+1).padStart(2,'0');
  const nxt=()=>{if(!AUTO||cur!==i)return;if(cur>=S.length-1)setAuto(false);else go(cur+1)};
  if(!$('#mb-'+i+' audio')){
    setAuto(false);
    ms(i,'Sin audio: la reproducción automática se detuvo.');
    return;
  }
  NARR.src=`./audio/${pad}.m4a`;
  NARR.onended=nxt;
  NARR.onerror=()=>{ms(i,'No se pudo cargar la locución.');setAuto(false)};
  NARR.onloadedmetadata=()=>{
    if(isFinite(NARR.duration)&&NARR.duration>0){clearTimeout(tmr);tmr=setTimeout(nxt,(NARR.duration+3)*1000)}
  };
  const pr=NARR.play();
  if(pr&&pr.catch)pr.catch(()=>{
    ms(i,'El navegador bloqueó el audio. Toque «Reproducción automática» otra vez.');
    setAuto(false);
  });
}
function setAuto(v){
  AUTO=v;
  $('#au').textContent=v?'Detener':'Reproducción automática';
  $('#au').classList.toggle('on',v);
  if(v){clkStart();playCur()}
  else{clkPause();clearTimeout(tmr);NARR.pause();document.querySelectorAll('.mb audio').forEach(e=>e.pause())}
}

/* ============ Música ambiental (multiplataforma: Windows, Android e iOS) ============ */
let MON = false;
let BGM_CTX = null;
let BGM_GAIN = null;

const BGM = new Audio('./audio/fondo.mp3'); // Verifica la extensión (.mp3, .m4a, .wav)
BGM.loop = true;
BGM.playsInline = true; // Evita pantalla completa o bloqueos en iOS

// Usa GainNode en servidores (GitHub Pages) para que el volumen funcione en iPhone/iPad;
// en archivos locales de Windows (file://) usa volume nativo para evitar bloqueos de seguridad.
const USE_WEB_AUDIO = location.protocol.startsWith('http');

function initBGMGraph() {
  if (!USE_WEB_AUDIO || BGM_CTX) return;
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  BGM_CTX = new AudioCtx();
  const source = BGM_CTX.createMediaElementSource(BGM);
  BGM_GAIN = BGM_CTX.createGain();
  BGM_GAIN.gain.value = 0.35;
  source.connect(BGM_GAIN);
  BGM_GAIN.connect(BGM_CTX.destination);
}

let fadeTmr = 0;
function setBGMVolume(target) {
  if (USE_WEB_AUDIO && BGM_GAIN && BGM_CTX) {
    BGM_GAIN.gain.setTargetAtTime(target, BGM_CTX.currentTime, 0.25);
    return;
  }
  clearInterval(fadeTmr);
  fadeTmr = setInterval(() => {
    const diff = target - BGM.volume;
    if (Math.abs(diff) < 0.01) {
      BGM.volume = target;
      clearInterval(fadeTmr);
    } else {
      BGM.volume = Math.max(0, Math.min(1, BGM.volume + diff * 0.25));
    }
  }, 35);
}

function duck() {
  if (!MON) return;
  const pl = [...document.querySelectorAll('.mb audio')].some(
    e => !e.paused && !e.muted && !e.ended
  ) || (!NARR.paused && !NARR.ended);
  // 15% con locución | 35% sin locución
  setBGMVolume(pl ? 0.15 : 0.35);

  // En móviles, reanuda la música si el sistema operativo la pausó al iniciar la voz
  if (BGM.paused) {
    BGM.play().catch(() => {});
  }
}

function setMusic(v) {
  MON = v;
  $('#mu').textContent = v ? 'Música: sí' : 'Música: no';
  if (v) {
    initBGMGraph();
    if (BGM_CTX && BGM_CTX.state === 'suspended') BGM_CTX.resume();
    BGM.play()
      .then(() => duck())
      .catch(err => {
        console.warn('No se pudo reproducir fondo.mp3:', err);
        MON = false;
        $('#mu').textContent = 'Música: no';
      });
  } else {
    BGM.pause();
  }
}

['play', 'pause', 'ended'].forEach(ev => NARR.addEventListener(ev, () => setTimeout(duck, 60)));
['play', 'pause', 'ended'].forEach(ev =>
  document.addEventListener(
    ev,
    e => {
      if (e.target && e.target.matches && e.target.matches('.mb audio')) {
        setTimeout(duck, 60);
      }
    },
    true
  )
);
  
/* ============ Eventos (navegación, tarjetas, música, índice, teclado) ============ */
function sel(el){
  const id=el.dataset.pk,j=+el.dataset.j;
  document.querySelectorAll(`[data-pk="${id}"]`).forEach(x=>x.setAttribute('aria-pressed',x===el));
  showPk(id,j);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-pk],button');
  if(!b)return;
  if(b.dataset.g!==undefined)return go(+b.dataset.g);
  if(b.dataset.pk)return sel(b);
});
$('#pv').onclick=()=>go(cur-1);
$('#nx').onclick=()=>go(cur+1);
$('#au').onclick=()=>setAuto(!AUTO);
$('#start-btn').onclick=()=>{setAuto(false);clkReset();go(0);setAuto(true)};
$('#mu').onclick=()=>setMusic(!MON);
$('#ixb').onclick=()=>$('#ix').classList.toggle('on');
addEventListener('keydown',e=>{
  const t=e.target;
  if(t.tagName==='AUDIO'||t.tagName==='VIDEO')return;
  if((e.key==='Enter'||e.key===' ')&&t.dataset&&t.dataset.pk&&t.tagName!=='BUTTON'){e.preventDefault();return sel(t)}
  if(e.key==='ArrowRight')go(cur+1);
  else if(e.key==='ArrowLeft')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(S.length-1);
  else if(e.key==='Escape')$('#ix').classList.remove('on');
});

/* ============ Tema y reloj ============ */
const R=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const dark=()=>R.dataset.theme?R.dataset.theme==='dark':mq.matches;
const lab=()=>$('#th').textContent=dark()?'Modo claro':'Modo oscuro';
$('#th').onclick=()=>{R.dataset.theme=dark()?'light':'dark';lab()};
mq.onchange=lab;lab();
setInterval(clkShow,250);clkShow();

/* ============ Ajuste responsivo ============ */
function fit(){
  const m=$('#mn'),W=m.clientWidth,Hh=m.clientHeight;
  const d=innerWidth>=900&&innerWidth/innerHeight>=1.15;
  document.body.classList.toggle('mob',!d);
  if(!d){st.style.transform='';return}
  const k=Math.min((W-40)/1280,(Hh-10)/640);
  st.style.transform=`translate(${(W-1280*k)/2}px,${(Hh-640*k)/2}px) scale(${k})`;
}
if('ResizeObserver' in window)new ResizeObserver(fit).observe($('#mn'));
addEventListener('resize',fit);
go(0);fit();
</script>
